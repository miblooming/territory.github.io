<svg xmlns="http://www.w3.org/2000/svg" width="500" height="634" viewBox="0 0 500 634" role="img"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#839e65"/></marker></defs><g font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif"><text x="250" y="26" text-anchor="middle" font-size="19" fill="#46633b" font-weight="600"><tspan x="250" dy="0">固定线路：一趟数量变化</tspan></text><path d="M80 398H36V92H80" fill="none" stroke="#9baa8a" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow)"/><path d="M36 194H78M36 296H78" fill="none" stroke="#9baa8a" stroke-width="2" stroke-dasharray="5 4"/><rect x="80" y="50" width="400" height="84" rx="7" fill="#eef4e2" stroke="#bed0aa"/><text x="280" y="79" text-anchor="middle" font-size="18" fill="#46633b" font-weight="600"><tspan x="280" dy="0">车站：空车出发</tspan></text><text x="280" y="106" text-anchor="middle" font-size="16" fill="#657951" font-weight="400"><tspan x="280" dy="0">车载 0；回站把剩余 300 入库</tspan></text><circle cx="80" cy="92" r="5" fill="#5f883e"/><path d="M280 137v12" fill="none" stroke="#839e65" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="80" y="152" width="400" height="84" rx="7" fill="#eef4e2" stroke="#bed0aa"/><text x="280" y="181" text-anchor="middle" font-size="18" fill="#46633b" font-weight="600"><tspan x="280" dy="0">大箱子 A：允许装载</tspan></text><text x="280" y="208" text-anchor="middle" font-size="16" fill="#657951" font-weight="400"><tspan x="280" dy="0">可供 500 → 装 500 → 车载 500</tspan></text><circle cx="80" cy="194" r="5" fill="#5f883e"/><path d="M280 239v12" fill="none" stroke="#839e65" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="80" y="254" width="400" height="84" rx="7" fill="#eef4e2" stroke="#bed0aa"/><text x="280" y="283" text-anchor="middle" font-size="18" fill="#46633b" font-weight="600"><tspan x="280" dy="0">货架 B：允许卸货</tspan></text><text x="280" y="310" text-anchor="middle" font-size="16" fill="#657951" font-weight="400"><tspan x="280" dy="0">缺 80 → 卸 80 → 车载剩 420</tspan></text><circle cx="80" cy="296" r="5" fill="#5f883e"/><path d="M280 341v12" fill="none" stroke="#839e65" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="80" y="356" width="400" height="84" rx="7" fill="#eef4e2" stroke="#bed0aa"/><text x="280" y="385" text-anchor="middle" font-size="18" fill="#46633b" font-weight="600"><tspan x="280" dy="0">货架 C：允许卸货</tspan></text><text x="280" y="412" text-anchor="middle" font-size="16" fill="#657951" font-weight="400"><tspan x="280" dy="0">缺 120 → 卸 120 → 车载剩 300</tspan></text><circle cx="80" cy="398" r="5" fill="#5f883e"/><text x="250" y="471" text-anchor="middle" font-size="16" fill="#547342" font-weight="600"><tspan x="250" dy="0">实线去程；虚线沿原路返程</tspan></text><text x="250" y="504" text-anchor="middle" font-size="16" fill="#657951" font-weight="400"><tspan x="250" dy="0">返程仍按条件装卸；终点画回本站则直接收车</tspan></text><text x="250" y="557" text-anchor="middle" font-size="15" fill="#657951" font-weight="400"><tspan x="250" dy="0">绿点为入口：路线要经过门道</tspan></text><text x="250" y="590" text-anchor="middle" font-size="14" fill="#657951" font-weight="400"><tspan x="250" dy="0">本例 B/C 只收货，容量与许可均满足</tspan></text></g></svg>