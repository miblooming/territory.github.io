<svg xmlns="http://www.w3.org/2000/svg" width="500" height="634" viewBox="0 0 500 634" role="img"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#839e65"/></marker></defs><g font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif"><text x="250" y="26" text-anchor="middle" font-size="19" fill="#46633b" font-weight="600"><tspan x="250" dy="0">固定線路：一趟數量變化</tspan></text><path d="M80 398H36V92H80" fill="none" stroke="#9baa8a" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow)"/><path d="M36 194H78M36 296H78" fill="none" stroke="#9baa8a" stroke-width="2" stroke-dasharray="5 4"/><rect x="80" y="50" width="400" height="84" rx="7" fill="#eef4e2" stroke="#bed0aa"/><text x="280" y="79" text-anchor="middle" font-size="18" fill="#46633b" font-weight="600"><tspan x="280" dy="0">車站：空車出發</tspan></text><text x="280" y="106" text-anchor="middle" font-size="16" fill="#657951" font-weight="400"><tspan x="280" dy="0">車載 0；回站把剩餘 300 入庫</tspan></text><circle cx="80" cy="92" r="5" fill="#5f883e"/><path d="M280 137v12" fill="none" stroke="#839e65" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="80" y="152" width="400" height="84" rx="7" fill="#eef4e2" stroke="#bed0aa"/><text x="280" y="181" text-anchor="middle" font-size="18" fill="#46633b" font-weight="600"><tspan x="280" dy="0">大箱子 A：允許裝載</tspan></text><text x="280" y="208" text-anchor="middle" font-size="16" fill="#657951" font-weight="400"><tspan x="280" dy="0">可供 500 → 裝 500 → 車載 500</tspan></text><circle cx="80" cy="194" r="5" fill="#5f883e"/><path d="M280 239v12" fill="none" stroke="#839e65" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="80" y="254" width="400" height="84" rx="7" fill="#eef4e2" stroke="#bed0aa"/><text x="280" y="283" text-anchor="middle" font-size="18" fill="#46633b" font-weight="600"><tspan x="280" dy="0">貨架 B：允許卸貨</tspan></text><text x="280" y="310" text-anchor="middle" font-size="16" fill="#657951" font-weight="400"><tspan x="280" dy="0">缺 80 → 卸 80 → 車載剩 420</tspan></text><circle cx="80" cy="296" r="5" fill="#5f883e"/><path d="M280 341v12" fill="none" stroke="#839e65" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="80" y="356" width="400" height="84" rx="7" fill="#eef4e2" stroke="#bed0aa"/><text x="280" y="385" text-anchor="middle" font-size="18" fill="#46633b" font-weight="600"><tspan x="280" dy="0">貨架 C：允許卸貨</tspan></text><text x="280" y="412" text-anchor="middle" font-size="16" fill="#657951" font-weight="400"><tspan x="280" dy="0">缺 120 → 卸 120 → 車載剩 300</tspan></text><circle cx="80" cy="398" r="5" fill="#5f883e"/><text x="250" y="471" text-anchor="middle" font-size="16" fill="#547342" font-weight="600"><tspan x="250" dy="0">實線去程；虛線沿原路返程</tspan></text><text x="250" y="504" text-anchor="middle" font-size="16" fill="#657951" font-weight="400"><tspan x="250" dy="0">返程仍按條件裝卸；終點畫回本站則直接收車</tspan></text><text x="250" y="557" text-anchor="middle" font-size="15" fill="#657951" font-weight="400"><tspan x="250" dy="0">綠點為入口：路線要經過門道</tspan></text><text x="250" y="590" text-anchor="middle" font-size="14" fill="#657951" font-weight="400"><tspan x="250" dy="0">本例 B/C 只收貨，容量與許可均滿足</tspan></text></g></svg>